name: Android APK

on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify and build both applications
        run: bash gradlew --no-daemon :app:testEmployeeDebugUnitTest :app:testManagerDebugUnitTest :app:lintEmployeeDebug :app:lintManagerDebug :app:assembleEmployeeDebug :app:assembleManagerDebug
      - name: Save test APKs
        uses: actions/upload-artifact@v4
        with:
          name: diriqo-android-test-apks
          path: apps/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
